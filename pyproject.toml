[project]
name = "beach-flights"
version = "0.1.0"
description = "Track and rank 1-night weekend beach flights from LGW and LHR by beach hours per pound and live sea temperature."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "flights>=0.8.0",
    "httpx>=0.27.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "rich>=13.9.0",
    "typer>=0.15.0",
    "tzdata>=2024.2",
    "uvicorn>=0.32.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.8.0",
]

[project.scripts]
beach-flights = "beach_flights.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/beach_flights"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: tests that make real network requests to Google Flights or Open-Meteo",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]
